[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
description = "Professor Data Portal — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyarrow>=16.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "libbase @ git+https://github.com/The-Band-Solution/libbase.git@v0.1.0",
    "eo_lib @ git+https://github.com/The-Band-Solution/eo_lib.git@v0.3.2",
    "research_domain @ git+https://github.com/The-Band-Solution/ResearchDomain.git@v0.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["portal"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true